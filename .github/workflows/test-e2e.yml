name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Start Vault
        run: |
          docker run -d \
            --name vault \
            -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=dev-only-token \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.21 \
            server -dev

      - name: Wait for Vault
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8200/v1/sys/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Vault did not become ready"
          docker logs vault
          exit 1

      - name: Seed Vault test secret
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: dev-only-token
        run: |
          curl \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "Content-Type: application/json" \
            --request POST \
            --data '{"data":{"username":"admin","password":"new-password"}}' \
            "${VAULT_ADDR}/v1/secret/data/test-secret"

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
      
      - name: Run provider integration tests
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: dev-only-token
        run: |
          go test -tags=integration ./internal/provider
